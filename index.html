    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'], },
                    colors: {
                        brand: { 500: '#38bdf8', 600: '#818cf8', 900: '#020617' },
                        apple: { bg: '#fbfbfd', text: '#1d1d1f' }
                    }
                }
            }
        }

    <style>
        body { 
            background-color: #020617; /* Dark top half */
            color: #f8fafc; 
            overflow-x: hidden;
        }
        
        /* Ambient Glow Effect for Hero */
        .ambient-glow {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(129, 140, 248, 0.05) 40%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            pointer-events: none;
        }

        /* Tech Grid Overlay for Hero */
        .tech-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -2;
            pointer-events: none;
        }
        
        /* Dark Glass Nav */
        .glass-nav {
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Light Mode Premium Cards (Apple Style) */
        .light-card {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .light-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.12);
        }

        /* Watermarked Background Numbers for Light Cards */
        .card-watermark {
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 140px;
            font-weight: 800;
            line-height: 1;
            color: rgba(0, 0, 0, 0.02);
            z-index: 0;
            pointer-events: none;
            transition: color 0.4s ease;
        }

        .light-card:hover .card-watermark {
            color: rgba(0, 0, 0, 0.04);
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        /* Text Gradients */
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
        }
        
        .text-gradient-brand {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
        }
    </style>
</head>
