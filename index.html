<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakshmi Mamidala | Enterprise Architect</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Ultra-stable Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            background-color: #050505; 
            color: #ffffff; 
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Aurora Background - Fixed stacking */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: #050505;
        }

        .orb-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 60%);
            filter: blur(80px);
        }

        .orb-2 {
            position: absolute;
            top: 20%;
            right: -20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(129, 140, 248, 0.10) 0%, transparent 60%);
            filter: blur(80px);
        }

        .orb-3 {
            position: absolute;
            bottom: -20%;
            left: 20%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(232, 121, 249, 0.08) 0%, transparent 60%);
            filter: blur(80px);
        }

        /* Essential for keeping text above the background */
        .content-layer {
            position: relative;
            z-index: 10;
        }

        /* Apple-style Bento Cards */
        .bento-card {
            background: rgba(24, 24, 27, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem;
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .bento-card:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
        }

        .text-gradient-hero {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #38bdf8, #818cf8, #e879f9);
        }

        .icon-box {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .impact-section {
            background: linear-gradient(to bottom, transparent, #080f1c 20%, #060b14 100%);
        }
        
        .impact-grid {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            opacity: 0.5;
        }
    </style>
</head>
<body class="selection:bg-cyan-500/30 selection:text-white">

    <!-- Background Layer -->
    <div class="aurora-bg">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
        <div class="orb-3"></div>
    </div>

    <!-- Content Layer -->
    <div class="content-layer">

        <!-- Floating Navigation -->
        <div class="fixed w-full z-50 top-6 px-6 flex justify-center">
            <nav class="bg-zinc-900/60 backdrop-blur-xl border border-white/10 rounded-full px-8 py-4 flex items-center gap-12 shadow-2xl">
                <div class="text-sm font-semibold tracking-wide text-white">Lakshmi Mamidala</div>
                <div class="w-px h-4 bg-white/20 hidden md:block"></div>
                <div class="hidden md:flex space-x-8 text-xs font-medium tracking-widest text-zinc-400 uppercase">
                    <a href="#strategy" class="hover:text-white transition-colors">Strategy</a>
                    <a href="#leadership" class="hover:text-white transition-colors">Authorship</a>
                    <a href="#advisory" class="hover:text-white transition-colors">Advisory</a>
                </div>
            </nav>
        </div>

        <!-- Hero Section -->
        <section class="pt-48 pb-24 md:pt-64 md:pb-32 px-6 flex flex-col items-center text-center">
            <div class="max-w-5xl">
                <h2 class="text-xs font-bold tracking-[0.3em] text-zinc-400 uppercase mb-8 flex items-center justify-center gap-4">
                    <span class="w-8
