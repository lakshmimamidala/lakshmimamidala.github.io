<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakshmi Mamidala</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Base Reset & Typography */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #050505; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }
        a { text-decoration: none; color: inherit; }
        
        /* Layout Utilities */
        .container { max-width: 80rem; margin: 0 auto; padding: 0 1.5rem; }
        .text-center { text-align: center; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .gap-12 { gap: 3rem; }
        
        /* Aurora Background */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; pointer-events: none; overflow: hidden; background: #050505;
        }
        .orb { position: absolute; filter: blur(80px); border-radius: 50%; }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, transparent 60%); }
        .orb-2 { top: 20%; right: -20%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(129, 140, 248, 0.10) 0%, transparent 60%); }
        .orb-3 { bottom: -20%; left: 20%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(232, 121, 249, 0.08) 0%, transparent 60%); }

        .content-layer { position: relative; z-index: 10; }

        /* Navigation */
        .nav-wrapper { position: fixed; top: 1.5rem; width: 100%; z-index: 50; display: flex; justify-content: center; padding: 0 1.5rem; }
        .nav-pill {
            background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 9999px;
            padding: 1rem 2rem; display: flex; align-items: center; gap: 3rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .nav-brand { font-size: 0.875rem; font-weight: 600; letter-spacing: 0.05em; color: #ffffff; text-transform: uppercase; }
        .nav-divider { width: 1px; height: 1rem; background: rgba(255, 255, 255, 0.2); }
        .nav-links { display: flex; gap: 2rem; }
        .nav-link { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; color: #a1a1aa; text-transform: uppercase; transition: color 0.3s; }
        .nav-link:hover { color: #ffffff; }

        /* Hero Section */
        .hero { padding: 16rem 1.5rem 8rem; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .hero-max { max-width: 64rem; }
        .hero-title { font-size: 4rem; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 3rem; color: #ffffff; }
        .hero-desc { font-size: 1.25rem; font-weight: 300; color: #d4d4d8; max-width: 48rem; margin: 0 auto; line-height: 1.7; }
        
        .text-gradient {
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #38bdf8, #818cf8, #e879f9);
        }

        /* Bento Grid */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin: 6rem auto; }
        .bento-card {
            background: rgba(24, 24, 27, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.5rem;
            padding: 3rem; transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s ease, border-color 0.4s ease;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .bento-card:hover {
            background: rgba(255, 255, 255, 0.03); border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
        }
        .icon-box {
            width: 3.5rem; height: 3.5rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center;
            margin-bottom: 2rem; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .icon-box svg { width: 1.5rem; height: 1.5rem; }
        
        .c-cyan { background: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.2); color: #22d3ee; }
        .c-violet { background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.2); color: #a78bfa; }
        .c-emerald { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .c-rose { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.2); color: #fb7185; }

        .card-title { font-size: 1.875rem; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 1rem; }
        .card-desc { color: #a1a1aa; font-size: 1.125rem; font-weight: 300; line-height: 1.6; margin-top: 1.5rem; }

        /* Impact Section */
        .impact-wrap { position: relative; margin-top: 3rem; }
        .impact-bg {
            background: linear-gradient(to bottom, transparent, #080f1c 20%, #060b14 100%);
            padding: 8rem 0; border-top: 1px solid rgba(255, 255, 255, 0.1); position: relative;
        }
        .impact-grid-pattern {
            position: absolute; inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px; z-index: 0; opacity: 0.5;
        }
        .impact-card {
            background: rgba(0, 0, 0, 0.4); padding: 3.5rem; border-radius: 2rem;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .impact-subtitle { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.5rem; display: flex; align-items: center; }
        .impact-line { width: 1.5rem; height: 1px; margin-right: 0.75rem; }
        .impact-title { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.025em; margin-bottom: 1.5rem; }
        .impact-desc { color: #d4d4d8; font-size: 1.125rem; font-weight: 300; line-height: 1.6; }

        /* Footer */
        .footer { padding: 3rem 0; background: #060b14; border-top: 1px solid rgba(255, 255, 255, 0.1); position: relative; z-index: 10; text-align: center; }
        .footer a { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; transition: color 0.3s; }
        .footer a:hover { color: #22d3ee; }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-divider, .nav-links { display: none; }
            .hero-title { font-size: 2.5rem; }
            .grid-2 { grid-template-columns: 1fr; }
            .hero { padding: 10rem 1.5rem 4rem; }
            .impact-card { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="aurora-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="content-layer">

        <!-- Navigation -->
        <div class="nav-wrapper">
            <nav class="nav-pill">
                <div class="nav-brand">Lakshmi Mamidala</div>
                <div class="nav-divider"></div>
                <div class="nav-links">
                    <a href="#strategy" class="nav-link">Strategy</a>
                    <a href="#leadership" class="nav-link">Authorship</a>
                    <a href="#advisory" class="nav-link">Advisory</a>
                </div>
            </nav>
        </div>

        <!-- Hero -->
        <section class="hero container">
            <div class="hero-max">
                <h1 class="hero-title">
                    Driving Enterprise AI product vision and mission-critical cloud strategy at <span class="text-gradient">massive scale.</span>
                </h1>
                <p class="hero-desc">
                    Bridging the gap between executive product roadmaps and complex
